services:
  danmaku-insight:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./config:/app/config          # LLM 配置（含 API Key），持久化到宿主机
    environment:
      # 后端选择：openai / anthropic
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-}
      # 密钥和接口地址不走环境变量，写进上面挂载的 ./config/llm.json
      # （-e 传的值会留在 docker inspect 里）
