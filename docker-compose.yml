services:
  danmaku-insight:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - model-cache:/root/.cache/huggingface
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - LLM_MODEL=Qwen/Qwen3-0.6B
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache:
