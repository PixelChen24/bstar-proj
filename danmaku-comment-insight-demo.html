ght:1.75;color:var(--ink2)}.slot .ref{font-size:11px;color:var(--cyan);margin-top:10px;cursor:pointer}.acts{counter-reset:a;display:grid;gap:10px}.act{display:flex;gap:13px;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.70);align-items:flex-start}.act:last-child{border:1px solid var(--line)}.act::before{counter-increment:a;content:counter(a);flex-shrink:0;width:28px;height:28px;border-radius:11px;background:linear-gradient(135deg,var(--pink),#ff9ab3);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(233,95,136,.22)}.act .src{font-size:11px;color:var(--ink3);margin-top:5px}#drill{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:10px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th{font-size:12px;color:var(--ink3);font-weight:720;background:#f7f1ec}.pill{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--pink-soft);color:var(--pink);border:1px solid #ffd9e3}.meta-line{margin-top:4px}.success{color:var(--mint)}.section-gap{margin-top:8px}.report-actions{margin-top:18px}@media(max-width:860px){body{padding:20px 14px 56px}.banner{grid-template-columns:1fr;min-height:auto;padding:28px}.hero-orbit{display:none}.panel{padding:20px}.cards{grid-template-columns:1fr}.slots{grid-template-columns:1fr}.slot,.slot:nth-child(1),.slot:nth-child(2){grid-column:auto}.vhead{grid-template-columns:1fr}.cover{width:100%;height:auto;aspect-ratio:16/9}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.entry{flex-direction:column;align-items:stretch}.entry .btn{width:100%}.progress-copy{align-items:flex-start}.progress-num{font-size:30px;min-width:76px}.stages{grid-template-columns:1fr;overflow:visible;padding-bottom:0}.stage{min-width:0}.theme-hd{align- <body>
<a class="skip-link" href="#main">跳到主要内容</a>
<main class="wrap" id="main">

  <section class="banner" aria-labelledby="page-title">
    <div class="banner-copy">
      <div class="eyebrow">Bilibili Audience Intelligence</div>
      <h1 id="page-title">弹幕评论区智能分析</h1>
      <p>输入一个 BV 号，把弹幕峰值、评论立场、争议主题和改进建议整理成一份清晰可导出的观众复盘报告。</p>
    </div>
    <div class="hero-orbit" aria-hidden="true">
      <div class="orbit-card"><span>弹幕主题聚类</span><b>DM</b></div>
      <div class="orbit-card"><span>高能时间切片</span><b>80</b></div>
      <div class="orbit-card"><span>评论立场归纳</span><b>AI</b></div>
    </div>
  </section>

  <section class="panel" id="entry" aria-label="输入 BV 号">
    <div class="entry">
      <input id="bv" aria-label="BV 号或稿件链接" placeholder="输入 BV 号或稿件链接，如 BV1xx411c7mD" value="BV1xx411c7mD">
      <button class="btn" id="go">生成复盘报告</button>
    </div>
    <div class="samples">
      <span class="tiny">样例视频：</span>
      <button class="chip" type="button" data-s="0">肖恩看</button>
      <button class="chip" type="button" data-s="1">好叫好伐</button>
      <button class="chip" type="button" data-s="2">笔吧评测室</button>
    </div>
  </section>

  <section class="panel hide" id="prog" aria-live="polite">
    <h2>正在生成观众复盘</h2>
    <div class="progress-hero">
      <div class="progress-copy">
        <div class="status-window" aria-label="当前分析状态">
          <div class="status-strip" id="status-strip">
            <span>准备接入弹幕宇宙…</span>
          </div>
        </div>
        <div class="progress-num" id="progress-num">0%</div>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill">
          <span class="progress-glow"></span>
        </div>
        <span class="bubble b1">✨</span>
        <span class="bubble b2">💬</span>
        <span class="bubble b3">🫧</span>
      </div>

      <div class="cute-line" id="cute-line">小助手正在戴上耳机听大家聊天 ✨</div>
    </div>
    <div class="stages">
      <div class="stage" data-k="0"><div class="dot">1</div>数据接入</div>
      <div class="stage" data-k="1"><div class="dot">2</div>清洗去重</div>
      <div class="stage" data-k="2"><div class="dot">3</div>聚类分析</div>
      <div class="stage" data-k="3"><div class="dot">4</div>智能归纳</div>
      <div class="stage" data-k="4"><div class="dot">5</div>生成报告</div>
    </div>
  </section>

  <section id="result" class="hide">

    <div class="panel">
      <div class="vhead">
        <div class="cover" id="vcover">封面</div>
        <div>
          <div class="video-title" id="vtitle"></div>
          <div class="tiny meta-line" id="vup"></div>
          <div class="stats">
            <div class="stat"><b id="s-play"></b><span>播放</span></div>
            <div class="stat"><b id="s-dm"></b><span>弹幕</span></div>
            <div class="stat"><b id="s-cm"></b><span>评论</span></div>
            <div class="stat"><b class="success" id="s-cost"></b><span>分析耗时</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>洞察概览 · 点卡片查看详情</h2>
      <div class="cards" id="cards"></div>
    </div>

    <div class="panel" id="drill"></div>

    <div class="panel">
      <h2>一页复盘结论</h2>
      <div class="slots" id="slots"></div>
      <h2 class="section-gap">Top 5 可执行改进建议</h2>
      <div class="acts" id="acts"></div>
      <div class="samples report-actions">
        <button class="btn ghost" id="export-md">导出 Markdown</button>
        <button class="btn ghost" id="again">重新演示</button>
      </div>
    </div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

$$('.chip').forEach(c=>c.onclick=()=>{
  $('#bv').value='BV1'+['xx411c7mD','aB4y1P7Qk','cD5x1M8Rn'][c.dataset.s];
});
$('#go').onclick=run;
$('#again').onclick=()=>{
  $('#result').classList.add('hide'); $('#entry').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
};
$('#export-md').onclick=exportMarkdown;

/* ─── 导出 Markdown ────────────────────────────────────── */

function exportMarkdown(){
  if(!DATA){ alert('请先生成报告'); return; }
  const D=DATA, v=D.video, L=[];

  L.push(`# ${v.title} · 观众复盘报告`,'');
  L.push(`- UP主：${v.up}`);
  L.push(`- 播放 ${v.play} ｜ 弹幕 ${v.dm} ｜ 评论 ${v.cm}`);
  if(v.duration) L.push(`- 时长：${fmtDur(v.duration)}`);
  if(v.bvid) L.push(`- 稿件：https://www.bilibili.com/video/${v.bvid}`);
  if(D.meta) L.push(`- 分析耗时 ${D.meta.elapsed||'-'}s ｜ 模型 ${D.meta.model||'-'}`);
  L.push('');

  if((D.slots||[]).length){
    L.push('## 一页复盘结论','');
    D.slots.forEach(s=>L.push(`**${s.h}**`,'',s.p,'',`> ${s.r}`,''));
  }

  if((D.acts||[]).length){
    L.push('## Top 可执行改进建议','');
    D.acts.forEach((a,i)=>L.push(`${i+1}. ${a.t}`,`   - 依据：${a.s}`));
    L.push('');
  }

  if((D.dmThemes||[]).length){
    L.push('## 弹幕反馈','','| 主题 | 次数 | 集中时段 |','|---|---|---|');
    D.dmThemes.forEach(t=>L.push(`| ${t.n} | ${t.c} | ${t.t} |`));
    L.push('');
  }

  if((D.peaks||[]).length){
    L.push('## 高能时刻','');
    D.peaks.forEach(p=>L.push(`- **${p.tm}**（密度 ${p.x}，${p.n} 条弹幕）${p.s?' — '+p.s:''}`));
    L.push('');
  }

  if((D.cmThemes||[]).length){
    L.push('## 评论总结','');
    D.cmThemes.forEach(t=>{
      L.push(`### ${t.n}　${t.c} 条${t.dis?`（争议度 ${t.dis}）`:''}`,'');
      (t.q||[]).forEach(q=>{
        const tags=[q.k==='con'?'反对面':'支持面',...(q.why||[])].join('｜');
        L.push(`> ${q.t}`,`> — ↑${q.l} ↩${q.r}　${tags}`,'');
      });
      if(t.note) L.push(`*${t.note}*`,'');
    });
  }

  const name=`复盘报告_${(v.bvid||'report')}.md`;
  const url=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}

let DATA = null; // 存储后端返回的报告数据

let progressTimer = null;
let phraseTimer = null;
let progressValue = 0;
let progressTarget = 0;
let activeStatus = '准备接入弹幕宇宙…';

const STAGE_TARGETS = [18, 36, 56, 78, 93];
const STAGE_EMOJI = ['📡','🧼','🧩','🧠','📄'];
const CUTE_PHRASES = [
  '小助手正在戴上耳机听大家聊天 ✨',
  '正在把密密麻麻的弹幕揉成小云朵 ☁️',
  '评论区的小情绪正在排队进场 🐣',
  '抓到几只高能片段，先放进收藏篮 🧺',
  '正在给观点贴上温柔的小标签 🏷️',
  '争议点在冒泡泡，马上帮你捞出来 🫧',
  '弹幕小精灵正在搬运关键词 🧚',
  '把观众的「哈哈哈」和「但是」分开放好 😆',
  '正在检查有没有复读机偷偷混进来 🤖',
  '灵感炉火已点燃，报告马上出锅 🍳',
  '请稍等，AI 正在认真眨眼思考 👀',
  '快好了快好了，最后再撒一点清晰度 🌟'
];

function pickCutePhrase(){
  return CUTE_PHRASES[Math.floor(Math.random() * CUTE_PHRASES.length)];
}

function setStatusText(text){
  activeStatus = text || activeStatus;
  const strip = $('#status-strip');
  if(!strip) return;
  strip.classList.remove('roll');
  void strip.offsetWidth;
  strip.textContent = activeStatus;
  strip.classList.add('roll');
}

function setCuteLine(text){
  const el = $('#cute-line');
  if(!el) return;
  el.classList.add('switching');
  setTimeout(()=>{
    el.textContent = text || pickCutePhrase();
    el.classList.remove('switching');
  }, 170);
}

function setProgressVisual(value){
  const pct = Math.max(0, Math.min(100, value));
  const rounded = Math.round(pct);
  const fill = $('#progress-fill');
  const num = $('#progress-num');
  if(fill) fill.style.width = `${pct}%`;
  if(num) num.textContent = `${rounded}%`;
}

function markProgressStage(stage){
  $$('.stage').forEach(el=>{
    const k = Number(el.dataset.k);
    el.className = 'stage' + (k < stage ? ' done' : k === stage ? ' doing' : '');
  });
}

function resetProgressUI(){
  clearInterval(progressTimer);
  clearInterval(phraseTimer);
  progressValue = 0;
  progressTarget = 8;
  $('#prog')?.classList.remove('error');
  $('#progress-fill')?.classList.remove('error');
  setProgressVisual(0);
  setStatusText('✨ 准备接入弹幕宇宙，初始化分析引擎…');
  setCuteLine('小助手正在戴上耳机听大家聊天 ✨');
  $$('.stage').forEach(s=>s.className='stage');

  progressTimer = setInterval(()=>{
    if(progressValue < progressTarget){
      progressValue += Math.max(.18, (progressTarget - progressValue) * .075);
    }else if(progressValue < 92){
      progressValue += .045;
    }
    setProgressVisual(Math.min(progressValue, 99));
  }, 80);

  phraseTimer = setInterval(()=>{
    setCuteLine(`${STAGE_EMOJI[Math.min(4, Math.max(0, Math.floor(progressValue / 22)))]} ${pickCutePhrase()}`);
  }, 2500);
}

function updateProgressFromEvent(d){
  const stage = Number(d.stage || 0);
  const emoji = STAGE_EMOJI[stage] || '✨';
  const extra = d.extra ? ` · ${d.extra}` : '';
  progressTarget = Math.max(progressTarget, STAGE_TARGETS[stage] || Math.min(95, progressValue + 8));
  markProgressStage(stage);
  setStatusText(`${emoji} ${d.msg || '正在分析'}${extra}`);
  setCuteLine(`${emoji} ${pickCutePhrase()}`);
}

function finishProgressUI(){
  clearInterval(progressTimer);
  clearInterval(phraseTimer);
  progressValue = 100;
  progressTarget = 100;
  setProgressVisual(100);
  setStatusText('🎉 复盘报告生成完成，正在整理漂亮版结果…');
  setCuteLine('报告已经热乎乎出炉啦，准备展开给你看 ✨');
  $$('.stage').forEach(s=>s.className='stage done');
}

function showProgressError(msg){
  clearInterval(progressTimer);
  clearInterval(phraseTimer);
  $('#prog')?.classList.add('error');
  $('#progress-fill')?.classList.add('error');
  setStatusText(`❌ ${msg || '连接中断，请稍后重试'}`);
  setCuteLine('小助手摔了一跤，但问题已经被标出来了 🩹');
  $$('.stage.doing').forEach(s=>s.classList.add('error'));
}

function run(){
  const bvInput = $('#bv').value.trim();
  if(!bvInput){ alert('请输入BV号'); return; }

  $('#entry').classList.add('hide');
  $('#prog').classList.remove('hide');
  $('#result').classList.add('hide');
  resetProgressUI();

  // 建立 SSE 连接
  const evtSource = new EventSource('/api/analyze/stream?bvid=' + encodeURIComponent(bvInput));

  evtSource.addEventListener('progress', e => {
    const d = JSON.parse(e.data);
    updateProgressFromEvent(d);
  });

  evtSource.addEventListener('done', e => {
    evtSource.close();
    DATA = JSON.parse(e.data);
    finishProgressUI();
    setTimeout(() => {
      $('#prog').classList.add('hide');
      render(DATA);
    }, 850);
  });

  evtSource.addEventListener('error', e => {
    evtSource.close();
    let msg = '连接中断，请稍后重试';
    try {
      if(e.data) msg = JSON.parse(e.data).msg || msg;
    } catch(_) {}
    showProgressError(msg);
  });
}

function render(D){
  const v = D.video, R = $('#result');
  R.classList.remove('hide');
  $('#vtitle').textContent = v.title;
  $('#vup').textContent = v.up;

  // B站图片有防盗链，必须去掉 Referer 才能加载
  const cov = $('#vcover');
  if(v.cover){
    cov.innerHTML = `<img src="${v.cover}" referrerpolicy="no-referrer" alt="视频封面"
      onerror="this.parentNode.textContent='封面'">`;
  }else{
    cov.textContent = '封面';
  }

  $('#s-play').textContent = v.play;
  $('#s-dm').textContent = v.dm.toLocaleString();
  $('#s-cm').textContent = v.cm.toLocaleString();
  $('#s-cost').textContent = (D.meta && D.meta.elapsed) ? D.meta.elapsed + 's' : '-';

  // 动态计算卡片摘要
  const dmCount = D.dmThemes ? D.dmThemes.length : 0;
  const pkCount = D.peaks ? D.peaks.length : 0;
  const cmCount = D.cmThemes ? D.cmThemes.length : 0;
  const actCount = D.acts ? D.acts.length : 0;
  const topPeak = D.peaks && D.peaks[0] ? `${D.peaks[0].tm} 密度达${D.peaks[0].x}` : '-';
  const hiDisCount = D.cmThemes ? D.cmThemes.filter(t=>t.dis==='高').length : 0;

  const cards=[
    {k:'dm', i:'✦', t:'弹幕反馈', b:dmCount+' 个主题', p:D.dmThemes&&D.dmThemes[0]?`最高频「${D.dmThemes[0].n}」${D.dmThemes[0].c} 条`:'-'},
    {k:'pk', i:'↯', t:'高能时刻', b:'TOP '+pkCount+' 片段', p:topPeak},
    {k:'cm', i:'◐', t:'评论总结', b:cmCount+' 个主题', p:hiDisCount?`含 ${hiDisCount} 个高争议主题`:`${cmCount} 个主题已归纳`},
    {k:'rp', i:'▣', t:'复盘报告', b:(D.slots?D.slots.length:0)+' 条结论', p:`Top${actCount} 可执行建议已生成`}];
  $('#cards').innerHTML = cards.map(c=>`
    <div class="card" data-k="${c.k}" role="button" tabindex="0" aria-label="查看${c.t}">
      <h3><span class="ico">${c.i}</span>${c.t}</h3>
      <div class="big">${c.b}</div>
      <div class="peek">${c.p}</div>
    </div>`).join('');
  $$('.card').forEach(c=>{
    const open=()=>{ $$('.card').forEach(x=>x.classList.remove('on')); c.classList.add('on'); drill(c.dataset.k); };
    c.onclick=open;
    c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
  });

  $('#slots').innerHTML = (D.slots||[]).map(s=>
    `<div class="slot"><h4>${s.h}</h4><p>${s.p}</p><div class="ref">▸ ${s.r}</div></div>`).join('');
  $('#acts').innerHTML = (D.acts||[]).map(a=>
    `<div class="act"><div><div>${a.t}</div><div class="src">依据：${a.s}</div></div></div>`).join('');

  drill('cm');
  R.scrollIntoView({behavior:'smooth'});
}

/* "mm:ss" -> 秒 */
function hms2sec(tm){
  const p = String(tm||'').split(':').map(Number);
  if(p.length === 3) return (p[0]*3600 + p[1]*60 + p[2]) || 0;
  if(p.length === 2) return (p[0]*60 + p[1]) || 0;
  return 0;
}

/* 秒 -> "mm:ss" / "h:mm:ss" */
function fmtDur(sec){
  sec = Math.round(sec||0);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function drill(k){
  const D = DATA;
  const Dr = $('#drill');
  if(k==='dm'){
    Dr.innerHTML=`<h2>弹幕反馈</h2>
      <table><tr><th>弹幕主题</th><th style="width:110px">出现次数</th><th style="width:150px">集中时段</th></tr>
      ${(D.dmThemes||[]).map(t=>`<tr><td>${t.n}</td><td><b>${t.c}</b> 条</td><td class="muted">${t.t}</td></tr>`).join('')}</table>`;
  }
  else if(k==='pk'){
    // 用真实视频时长定位峰值；缺失时退回按最大峰值时间点估算
    const peaks = D.peaks || [];
    const maxSec = peaks.reduce((m,p)=>Math.max(m, hms2sec(p.tm)), 0);
    const totalDur = (D.video && D.video.duration) || Math.max(maxSec * 1.2, 60);

    const cols=Array.from({length:80},(_,i)=>{
      let h = 8;
      for(const p of peaks){
        const idx = Math.floor(hms2sec(p.tm) / totalDur * 80);
        if(Math.abs(i - idx) <= 1) h = Math.min(58, parseFloat(p.x) * 8);
      }
      const hot = h > 20;
      return `<div class="col ${hot?'hot':''}" style="left:${i*1.25}%;height:${h}px"></div>`;
    }).join('');

    Dr.innerHTML=`<h2>高能时刻</h2>
      <div class="axis">${cols}</div>
      <div class="tiny">横轴为视频进度（全长 ${fmtDur(totalDur)}），粉色为弹幕密度峰值区间</div>
      ${peaks.map(p=>`<div class="peak"><div class="tm">${p.tm}</div>
        <div><div><b>密度 ${p.x}</b>　<span class="muted">该区间 ${p.n} 条弹幕</span></div>
        <div style="margin-top:5px">${p.s||''}</div></div></div>`).join('')}`;
  }
  else if(k==='cm'){
    Dr.innerHTML=`<h2>评论总结 · 点标题展开</h2>
      ${(D.cmThemes||[]).map((t,i)=>`
        <div class="theme ${i===0?'open':''}">
          <div class="theme-hd" onclick="this.parentNode.classList.toggle('open')">
            <span class="arrow">▶</span>
            <span class="nm">${t.n}</span>
            <span class="tiny">${t.c} 条</span>
            <span class="bar"><i style="width:${t.pct||0}%"></i></span>
            ${t.dis?`<span class="badge">争议度 ${t.dis}</span>`:''}
          </div>
          <div class="theme-bd">
            ${(t.q||[]).map(q=>`<div class="quote ${q.k}">${q.t}
              <div class="quote-meta"><span>↑ ${q.l}</span><span>↩ ${q.r}</span>
              <span class="tiny">${q.k==='con'?'反对面':'支持面'}</span>
              ${(q.why||[]).map(w=>`<span class="badge">${w}</span>`).join('')}</div></div>`).join('')}
            ${t.note?`<div class="note">${t.note}</div>`:''}
          </div>
        </div>`).join('')}`;
  }
  else{
    Dr.innerHTML=`<h2>复盘报告</h2>
      <div class="muted">五个固定问题的结论与 Top5 建议见下方「一页复盘结论」。</div>`;
  }
}
</script>
